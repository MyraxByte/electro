name: Bug Report
description: Report a bug in ElectroJS
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal code or a link to a repo that reproduces the issue.
      placeholder: |
        import { AppKernel, createConsoleLogger } from "@electrojs/runtime";

        const kernel = AppKernel.create(AppModule, {
            logger: createConsoleLogger(),
        });

        app.on("before-quit", () => {
            void kernel.shutdown();
        });

        void app.whenReady().then(() => {
            void kernel.start(); // <- error here
        });
      render: ts
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or stack traces.
    validations:
      required: true

  - type: dropdown
    id: packages
    attributes:
      label: Affected packages
      multiple: true
      options:
        - "@electrojs/runtime"
        - "@electrojs/common"
        - "@electrojs/config"
        - "@electrojs/renderer"
        - "@electrojs/codegen"
        - "@electrojs/cli"
        - "create-electro"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ElectroJS version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: electron-version
    attributes:
      label: Electron version
      placeholder: "41.0.0"

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "25.0.0"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.4 / Windows 11 / Ubuntu 24.04"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant console output or logs.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other information that might help (screenshots, related issues, etc).
