name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Publish @electrojs/common
        working-directory: packages/common
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/config
        working-directory: packages/config
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/renderer
        working-directory: packages/renderer
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/runtime
        working-directory: packages/runtime
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/codegen
        working-directory: packages/codegen
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/cli
        working-directory: packages/cli
        run: pnpm publish --access public --no-git-checks

      - name: Publish create-electro
        working-directory: packages/create-electro
        run: pnpm publish --access public --no-git-checks

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const match = /^v(\d+)\.(\d+)\.\d+$/.exec(tag);
            const versionLine = match ? `v${match[1]}.${match[2]}` : tag;
            const docsUrl = `https://electrojs.myraxbyte.dev/versions/${versionLine}/`;
            const body = `Documentation snapshot: ${docsUrl}`;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists. Skipping creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body,
              generate_release_notes: true,
              make_latest: "true",
            });
