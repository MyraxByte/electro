name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Publish @electrojs/common
        working-directory: packages/common
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/config
        working-directory: packages/config
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/renderer
        working-directory: packages/renderer
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/runtime
        working-directory: packages/runtime
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/codegen
        working-directory: packages/codegen
        run: pnpm publish --access public --no-git-checks

      - name: Publish @electrojs/cli
        working-directory: packages/cli
        run: pnpm publish --access public --no-git-checks

      - name: Publish create-electro
        working-directory: packages/create-electro
        run: pnpm publish --access public --no-git-checks
